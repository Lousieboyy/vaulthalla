<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                display: flex;
                justify-content: center;
                align-content: center;
                min-height: 100vh;
                background: linear-gradient(
                    rgba(34,34,34,0.6),
                    rgba(34,34,34,0.6)
                ),
                url("login1.jpg");
                background-size: cover;
                background-position: center;
            }
            .login-base{
                width: 320px;
                height: 320px;
                margin-top: 200px;
                display: flex;
                justify-content: space-around;
                align-items: center;
                flex-direction: column;
                background: transparent;
                border: 3px solid rgb(255,255,255);
                backdrop-filter: blur(5px);
                box-shadow: 0 0 10px rgba(0,0,0.2);
                color: #fff;
                border-radius: 10px;
                padding: 30px 40px;
            }
            .box-login{
                font-size: 35px;
                font-weight: bolder;
            }
            .username{
                background: transparent;
                backdrop-filter: bluer(2px);
                border: 2px solid rgb(255,255,255);
                border-radius: 50px;
                text-indent: 20px;
                font-size: 15px;
                color: #fff;
                padding: 10px 130px 10px 0px;

            }
            .password{
                background: transparent;
                backdrop-filter: bluer(2px);
                border: 2px solid rgb(255,255,255);
                border-radius: 50px;
                text-indent: 20px;
                font-size: 15px;
                color: #fff;
                padding: 10px 130px 10px 0px;
                padding-bottom: 10px;
                padding-right: 130px;
            }
            i{
                color: #fff;
            }
            a{
                text-decoration: none;
            }
            button{
                padding: 10px 130px 10px 130px;
                border:none;
                border-radius: 50px;
                cursor: pointer;
            }
            ::placeholder{
                color: #fff;
            }
        </style>
    </head>

    <body>
            <div class="login-base">
                <div class="box-login">LOG IN</div>
                <div class="box-username">
                    <input type="text" class="username" placeholder="Username">
                </div>
                <div class="box-password">
                    <input type="password" class="password" placeholder="Password">
                </div>
                <a href="" target=""><i>Forgot Password</i></a>
                <div class="box-signin">
                    <a href="home-page.html"><button>SIGN IN</button></a>
                </div>
            </div>
    </body>
</html>
