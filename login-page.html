<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self';">
  <title>Vaulthalla | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-shell" data-page="login" style="--bg-image:url('login1.jpg')">
  <main class="auth-wrap">
    <section class="auth-card">
      <h1>Log in to Vaulthalla</h1>
      <p class="small">Secure access to your notes and flashcards.</p>
      <form id="loginForm" class="form-stack" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" maxlength="24" required placeholder="e.g. ari.study">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters">

        <button type="submit">Sign in</button>
        <p id="loginAlert" class="alert" role="status" aria-live="polite"></p>
      </form>
      <p class="small">Demo tip: any valid username + 8+ character password works.</p>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
