<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self';">
  <title>Vaulthalla | Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-shell" data-page="notes" style="--bg-image:url('note1.jpg')">
  <div class="container">
    <nav class="navbar" aria-label="Main navigation">
      <strong class="brand">VAULTHALLA</strong>
      <ul class="nav-links">
        <li><a data-page="home" href="home-page.html">Home</a></li>
        <li><a data-page="notes" href="notes-page.html">Notes</a></li>
        <li><a data-page="flashcards" href="flashcards-page.html">Flashcards</a></li>
        <li><a data-page="library" href="card-section.html">Library</a></li>
      </ul>
      <img class="avatar" src="profile2.png" alt="Profile avatar">
    </nav>

    <main>
      <section class="hero">
        <h1>Jomsviking's Secret Archive</h1>
        <p>Filter notes by faculty, course, and subject, then preview uploaded material safely.</p>

        <div class="inline">
          <select id="faculty" aria-label="Faculty filter"><option value="">All faculties</option></select>
          <select id="course" aria-label="Course filter"><option value="">All courses</option></select>
          <select id="subject" aria-label="Subject filter"><option value="">All subjects</option></select>
        </div>

        <div class="inline">
          <input id="search" type="search" placeholder="Search by title, summary, or topic">
        </div>

        <section class="card">
          <h2>Upload note image</h2>
          <input type="file" id="imageUpload" accept="image/png, image/jpeg, image/webp">
          <p id="uploadAlert" class="alert" role="status" aria-live="polite"></p>
          <div id="preview" class="preview"><span class="small">No image selected.</span></div>
        </section>

        <section id="notesList" class="notes-list grid"></section>
      </section>
    </main>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
