<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self';">
  <title>Vaulthalla | Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-shell" data-page="flashcards" style="--bg-image:url('flash.jpg')">
  <div class="container">
    <nav class="navbar" aria-label="Main navigation">
      <strong class="brand">VAULTHALLA</strong>
      <ul class="nav-links">
        <li><a data-page="home" href="home-page.html">Home</a></li>
        <li><a data-page="notes" href="notes-page.html">Notes</a></li>
        <li><a data-page="flashcards" href="flashcards-page.html">Flashcards</a></li>
        <li><a data-page="library" href="card-section.html">Library</a></li>
      </ul>
      <img class="avatar" src="profile2.png" alt="Profile avatar">
    </nav>

    <main>
      <section class="hero">
        <h1>Askeladd's Army Camp</h1>
        <p>Practice active recall with smooth flip animations and build your own deck.</p>

        <p id="cardCounter" class="small"></p>
        <div class="flashcard-shell">
          <article id="flashcard" class="flashcard" aria-live="polite">
            <div class="face front"><h2 id="flashQ"></h2></div>
            <div class="face back"><h2 id="flashA"></h2></div>
          </article>
        </div>

        <div class="inline" style="margin-top: 1rem;">
          <button id="prevBtn" type="button" class="secondary">Previous</button>
          <button id="flipBtn" type="button">Flip</button>
          <button id="nextBtn" type="button" class="secondary">Next</button>
        </div>

        <section class="card" style="margin-top: 1rem;">
          <h2>Add a flashcard</h2>
          <form id="newCardForm" class="form-stack">
            <input id="newQuestion" maxlength="180" required placeholder="Question">
            <textarea id="newAnswer" maxlength="180" required placeholder="Answer"></textarea>
            <button type="submit">Add card</button>
            <p id="flashAlert" class="alert" role="status" aria-live="polite"></p>
          </form>
        </section>
      </section>
    </main>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
