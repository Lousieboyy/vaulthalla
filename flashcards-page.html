<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Flashcard Generator</title>
    <style>
        body {
            font-family: 'Cormorant Upright', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(
                rgba(34, 34, 34, 0.6),
                rgba(34, 34, 34, 0.6)
            ),
            url("flash.jpg");
            background-size: cover;
            background-position: center;
        }
        nav {
            padding: 40px;
            font-size: 20px;
        }
        ul {
            list-style: none;
            display: flex;
            padding: 0;
            margin: 0;
            align-items: center;
        }
        li {
            position: relative;
            margin: 0 15px;
            transition: 1s;
            cursor: pointer;
            color: white;
        }
        li::after {
            position: absolute;
            content: "";
            width: 100%;
            height: 3px;
            top: 100%;
            left: 0;
            transition: transform 0.5s;
            transform: scale(0);
            transform-origin: right;
            background-color: white;
        }
        li:hover {
            color: yellow;
            font-size: large;
            transition: 0.5s;
        }
        li:hover::after {
            transform: scale(1);
            transform-origin: left;
        }
        .profile {
            margin-left: auto;
        }
        .profile img {
            width: 100px;
        }
        div {
            margin-top: 20px;
            color: white;
        }
        header {
            color: white;
            font-size: 50px;
        }
        a {
            text-decoration: none;
            color: white;
        }
        a:hover {
            color: yellow;
            font-size: large;
            transition: 0.5s;
        }
        a:hover::after {
            transform: scale(1);
            transform-origin: left;
        }
        .flashcard-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }
        .flashcard {
            width: 300px;
            height: 200px;
            margin: 10px;
            perspective: 1000px;
            cursor: pointer;
        }
        .flashcard-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }
        .flashcard.flip .flashcard-inner {
            transform: rotateY(180deg);
        }
        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            background-color: rgba(255, 255, 255, 0.8);
            color: #222;
        }
        .flashcard-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>HOME</li>
            <li><a href="notes-page.html">NOTES</a></li>
            <li>FLASHCARDS</li>
            <li>LIBRARY</li>
            <li>TRACKER</li>
            <li class="profile"><img src="profile2.png" alt="Profile"></li>
        </ul>
    </nav>
    <main>
        <header><center>ASKELADD'S ARMY CAMP</center></header>
        <div class="flashcard-container" id="flashcard-container"></div>
    </main>
    <footer></footer>

    <script>
        // Example flashcards
        const flashcards = [
            { question: "What is the capital of France?", answer: "Paris" },
            { question: "What is 2 + 2?", answer: "4" },
            { question: "What is the largest ocean on Earth?", answer: "Pacific Ocean" },
        ];

        // Function to create flashcards
        function createFlashcards() {
            const container = document.getElementById('flashcard-container');

            flashcards.forEach(card => {
                const flashcard = document.createElement('div');
                flashcard.className = 'flashcard';
                
                const flashcardInner = document.createElement('div');
                flashcardInner.className = 'flashcard-inner';
                
                const flashcardFront = document.createElement('div');
                flashcardFront.className = 'flashcard-front';
                flashcardFront.textContent = card.question;
                
                const flashcardBack = document.createElement('div');
                flashcardBack.className = 'flashcard-back';
                flashcardBack.textContent = card.answer;

                flashcardInner.appendChild(flashcardFront);
                flashcardInner.appendChild(flashcardBack);
                flashcard.appendChild(flashcardInner);

                flashcard.addEventListener('click', function () {
                    flashcard.classList.toggle('flip');
                });

                container.appendChild(flashcard);
            });
        }

        // Call the function to generate flashcards
        createFlashcards();
    </script>
</body>
</html>
