<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            display: flex;
            flex-direction: column; /* Stack elements vertically */
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(
                rgba(34, 34, 34, 0.6),
                rgba(34, 34, 34, 0.6)
            ),
            url("login1.jpg");
            background-size: cover;
            background-position: center;
        }

        nav {
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: sticky; /* Make the navbar sticky */
            top: 0; /* Stick to the top of the page */
            background:transparent; /* Optional: add background for visibility */
            z-index: 1000; /* Ensure it stays above other content */
        }

        ul {
            list-style: none;
            display: flex;
            padding: 0;
            margin: 0;
        }

        li {
            position: relative;
            margin: 0 15px;
            transition: 1s;
            cursor: pointer;
            color: white;
        }

        li::after {
            position: absolute;
            content: "";
            width: 100%;
            height: 3px;
            top: 100%;
            left: 0;
            transition: transform 0.5s;
            transform: scale(0);
            transform-origin: right;
            background-color: white;
        }

        li:hover {
            color: yellow;
            font-size: large;
            transition: 0.5s;
        }

        li:hover::after {
            transform: scale(1);
            transform-origin: left;
        }

        .flip-card {
            background-color: transparent;
            width: 300px;
            height: 300px;
            perspective: 1000px;
            margin: 20px auto; /* Center the flip card horizontally */
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
        }

        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .flip-card-front {
            background-color: #bbb;
            color: black;
        }

        .flip-card-back {
            background-color: #2980b9;
            color: white;
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>SLOT 1</li>
            <li>SLOT 2</li>
            <li>SLOT 3</li>
            <li>SLOT 4</li>
            <li>SLOT 5</li>
        </ul>
        <hr>
    </nav>
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <img src="profile1.png" alt="Avatar" style="width:300px;height:300px;">
            </div>
            <div class="flip-card-back">
                <h1>John Doe</h1>
                <p>Architect & Engineer</p>
                <p>We love that guy</p>
            </div>
            
        </div>
    </div>
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <img src="profile1.png" alt="Avatar" style="width:300px;height:300px;">
            </div>
            <div class="flip-card-back">
                <h1>John Doe</h1>
                <p>Architect & Engineer</p>
                <p>We love that guy</p>
            </div>
            
        </div>
    </div>
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <img src="profile1.png" alt="Avatar" style="width:300px;height:300px;">
            </div>
            <div class="flip-card-back">
                <h1>John Doe</h1>
                <p>Architect & Engineer</p>
                <p>We love that guy</p>
            </div>
            
        </div>
    </div>
    <footer>

</body>
</html>
