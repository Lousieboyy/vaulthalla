    <style>
        *,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: hsl(0, 0%, 9%);
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: "Rubik", sans-serif;
}

.navigation {
  display: flex;
  align-items: center;
  width: auto;
  padding-inline: 0.5em;
  height: 58px;
  background: hsl(0, 0%, 13%);
  border-radius: 100vw;
  border: 1px solid hsla(0, 0%, 100%, 0.7);
  box-shadow: 0 0 2px hsla(0, 0%, 100%, 0.2);
}

.elements-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: flex-end;
  gap: 0.5rem;
  padding-block: 0.5em;
  position: relative;
}

.separator {
  height: 2rem;
  width: 2px;
  background: hsla(0, 0%, 100%, 0);
}

i {
  font-size: 1.25rem;
  color: #111;
  transition: 250ms ease;
}

a:hover i {
  font-size: 2.75rem;
}

a {
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border-radius: 100vw;
  width: 2.5rem;
  aspect-ratio: 1;
  transition: width 300ms ease;
  position: relative;
}

a:hover {
  position: relative;
  width: 5rem;
  aspect-ratio: 1;
}

a::before {
  content: "";
  position: absolute;
  bottom: 110%;
  background: hsl(0, 0%, 18%, 0.5);
  color: white;
  font-size: 14px;
  padding: 0.25em 0.5em;
  border-radius: 0.25em;
  opacity: 0;
  scale: 0;
  transition: scale 300ms ease;
}

a:hover::before {
  opacity: 1;
  scale: 1;
}

.linkedin::before {
  content: "LinkedIn";
}

.github::before {
  content: "Github";
}

.instagram::before {
  content: "Instagram";
}

.dribbble::before {
  content: "Dribbble";
}

.mail::before {
  content: "Mail";
}

.website::before {
  content: "Website";
}

.sc-large {
  width: 4rem;
  aspect-ratio: 1;
  transition: 350ms;
}

.sc-large i {
  font-size: 2.25rem;
  /*   transition: 500ms; */
}

.th-large {
  width: 3rem;
  aspect-ratio: 1;
  transition: 350ms;
}

.th-large i {
  font-size: 1.75rem;
  /*   transition: 500ms; */
}

    </style>
